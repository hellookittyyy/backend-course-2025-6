<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Search</title>
    <link rel="stylesheet" href="css/search.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Inventory Search</h1>
    <form action="/search" method="GET">
        <div id ="one">
            <label for="id">ID:</label>
            <input type="text" id="id" name="id" required>
        </div>
        <div id ="two">
            <input type="checkbox" id="includePhoto" name="includePhoto">
            <label for="includePhoto">Include photo in description</label>
        </div>
        <button id="button" type="submit">Search</button>
    </form>
</body>
</html>
